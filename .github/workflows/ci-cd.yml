name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.8
      - name: Install Dependencies
        run: pip install flake8
      - name: Lint Code
        run: flake8 src

  test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu environment for the job

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Check out your repository's code

    - name: Set up Python
      uses: actions/setup-python@v2  # Set up Python environment
      with:
        python-version: 3.9  # Specify Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip  # Upgrade pip
        pip install -r requirements.txt  # Install dependencies from requirements.txt

    - name: Start Flask app in the background
      run: |
        nohup python app.py &  # Start the Flask app in the background
        sleep 5  # Give Flask some time to start

    - name: Run tests
      run: |
        python -m unittest discover -s src -p "test_*.py"  # Run the unit tests

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Deploying app (simulate deployment here)"
