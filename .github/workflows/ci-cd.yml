name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: 3.8
      - name: Install Dependencies
        run: pip install flake8
      - name: Lint Code
        run: flake8 src

  # Job to start the Flask app
  start_flask:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start Flask app in the background
      run: |
        nohup python app.py > flask.log 2>&1 &  # Start Flask in the background
        sleep 10  # Wait for Flask to start

    - name: Verify Flask app is running
      run: |
        curl --silent --fail http://127.0.0.1:5000  # Check if Flask app is running
        tail -n 10 flask.log  # Show last 10 lines of Flask logs to debug if needed

  # Job to run tests after Flask app has started
  run_tests:
    runs-on: ubuntu-latest
    needs: start_flask  # This job depends on the start_flask job

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m unittest discover -s src -p "test_*.py"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Deploying app (simulate deployment here)"
